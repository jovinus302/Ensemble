<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant reservations</title>
<style>
  :root { color-scheme: light dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    background: #f5f6f8;
    color: #1b1d21;
  }
  main {
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 1.25rem; }
  form { display: flex; flex-direction: column; gap: 1.1rem; }
  label { display: flex; flex-direction: column; gap: .35rem; font-weight: 600; }
  input, select {
    font: inherit;
    width: 100%;
    max-width: 100%;
    padding: .6rem .7rem;
    border: 1px solid #b7bac2;
    border-radius: .5rem;
    background: #fff;
    color: inherit;
  }
  .hint { font-weight: 400; font-size: .85rem; color: #5a5f6a; }
  button {
    font: inherit;
    font-weight: 700;
    width: 100%;
    padding: .7rem 1rem;
    border: 1px solid transparent;
    border-radius: .5rem;
    background: #1f6feb;
    color: #fff;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #195ac4; }
  button:disabled { opacity: .6; cursor: progress; }
  button[data-testid="edit"] { background: #fff; color: #1f6feb; border-color: #1f6feb; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid #1f6feb;
    outline-offset: 2px;
  }
  [data-testid="message"] {
    margin: 0;
    min-height: 1.25rem;
    color: #b42318;
    font-weight: 600;
  }
  [data-testid="message"]:empty { min-height: 0; }
  .confirmation-card {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    padding: 1.25rem;
    background: #fff;
    border: 1px solid #cdebd6;
    border-left: 4px solid #1a7f37;
    border-radius: .6rem;
  }
  [data-testid="confirmation"] { margin: 0; font-size: 1.05rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #15171c; color: #e8eaef; }
    input, select { background: #22252c; border-color: #3a3f4b; }
    .hint { color: #a2a7b2; }
    button[data-testid="edit"] { background: transparent; color: #7aa7ff; border-color: #7aa7ff; }
    [data-testid="message"] { color: #ff8a7a; }
    .confirmation-card { background: #18251c; border-color: #2f5d3a; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
