<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클릭 카운터 (시연용)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f5f6f8;
    color: #1f2933;
  }
  .demo-banner {
    width: 100%;
    padding: 10px 16px;
    text-align: center;
    background: #fff4d6;
    color: #7a5600;
    font-size: 14px;
    border-bottom: 1px solid #f0dca0;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px;
  }
  .count {
    font-size: 120px;
    font-weight: 700;
    line-height: 1;
    min-width: 3ch;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font: inherit;
    font-size: 20px;
    padding: 14px 28px;
    border-radius: 10px;
    border: 1px solid #cbd2d9;
    background: #ffffff;
    color: #1f2933;
    cursor: pointer;
  }
  button:hover { background: #eef1f4; }
  button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
  #btn-inc { background: #2563eb; border-color: #2563eb; color: #fff; }
  #btn-inc:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="demo-banner">시연용 가상 자료입니다. 값은 저장되지 않으며 새로고침하면 0으로 돌아갑니다.</div>
  <main>
    <div class="count" id="count" aria-live="polite" aria-label="현재 값">0</div>
    <div class="buttons">
      <button type="button" id="btn-inc">+1</button>
      <button type="button" id="btn-reset">초기화</button>
    </div>
  </main>
<script>
  (function () {
    var count = 0;
    var display = document.getElementById('count');

    function render() {
      display.textContent = String(count);
    }

    document.getElementById('btn-inc').addEventListener('click', function () {
      count += 1;
      render();
    });
    document.getElementById('btn-reset').addEventListener('click', function () {
      count = 0;
      render();
    });

    render();
  })();
</script>
</body>
</html>
