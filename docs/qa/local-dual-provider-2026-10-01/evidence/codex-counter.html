<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클릭 카운터</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f6fa; color: #172338; font-family: system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 36px 24px; text-align: center; background: white; border: 1px solid #dce2ec; border-radius: 20px; }
    .notice { margin: 0 0 24px; color: #52627b; font-size: 14px; }
    h1 { margin: 0; font-size: 24px; }
    output { display: block; margin: 24px 0 32px; font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button { min-height: 48px; padding: 12px 22px; border: 1px solid #c6cfdf; border-radius: 10px; background: #eef2f8; color: #172338; font: inherit; font-weight: 600; cursor: pointer; }
    button:first-child { background: #2458cc; border-color: #2458cc; color: white; }
    button:hover { filter: brightness(.94); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #966000; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="notice">시연용 가상 자료</p>
    <h1>클릭 카운터</h1>
    <output id="count" aria-label="현재 값" aria-live="polite" aria-atomic="true">0</output>
    <div class="buttons">
      <button id="increase" type="button">+1</button>
      <button id="reset" type="button">초기화</button>
    </div>
  </main>
  <script>
    let count = 0n;
    const display = document.getElementById('count');
    function render() { display.textContent = count.toString(); }
    document.getElementById('increase').addEventListener('click', () => { count += 1n; render(); });
    document.getElementById('reset').addEventListener('click', () => { count = 0n; render(); });
  </script>
</body>
</html>
