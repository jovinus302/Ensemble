<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Interview Loop · 로컬 시연</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#18342e;background:#f3f5f0;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{max-width:1000px;margin:auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.badge{font-size:13px;background:#e1ebdd;border-radius:30px;padding:5px 12px}main{max-width:760px;margin:20px auto;padding:0 24px 60px}nav{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}nav span{font-size:13px;color:#61746d;padding:8px 12px;border-radius:8px}nav .active{background:#183f35;color:white}.card{background:white;border:1px solid #dce3d9;border-radius:24px;padding:40px;box-shadow:0 12px 36px #17332908}h1{font-size:32px;line-height:1.3;letter-spacing:-1px;margin:8px 0 16px}p{margin:12px 0}.eyebrow{font-size:13px;font-weight:700;color:#577453;letter-spacing:1px}.muted{color:#62716a}.notice{padding:16px;background:#f0f5ea;border-radius:12px;font-size:14px;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}button{font:inherit;cursor:pointer;background:#215c47;color:white;border:1px solid #215c47;border-radius:10px;padding:12px 20px;font-weight:650}button.secondary{background:white;color:#215c47;border-color:#bdccc1}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible{outline:3px solid #bd8015;outline-offset:4px}label{display:block;font-weight:650;margin-top:20px}input{display:block;width:100%;font:inherit;border:1px solid #9dad9f;border-radius:10px;padding:12px;margin-top:8px;background:#fff}input[aria-invalid=true]{border:2px solid #af3636}.error{color:#a52d2d;font-size:14px;min-height:22px;margin:4px 0}.slots{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}.slots button{background:white;color:#215c47;min-width:110px}.slots button[aria-pressed=true]{background:#215c47;color:white}.status{font-weight:700;color:#215c47}dl{margin:24px 0}dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e6ebe3}dt{color:#62716a}dd{margin:0;text-align:right;font-weight:600}footer{text-align:center;font-size:12px;color:#62716a;padding:20px}@media(max-width:540px){header{padding:20px 16px}.badge{font-size:11px}main{margin-top:8px;padding:0 16px 32px}.card{padding:24px}h1{font-size:27px}nav{gap:2px}nav span{padding:6px;font-size:12px}.actions button{flex:1}dl div{display:block}dd{text-align:left;margin-top:4px}}
</style>
</head>
<body>
<header><div class="brand">Interview Loop<span aria-hidden="true"> ↗</span></div><span class="badge">가상 자료 · 로컬 시연</span></header>
<main><nav aria-label="체험 단계" id="steps"></nav><section class="card" id="screen" aria-labelledby="title"></section></main>
<footer>실제 계정 생성 · 메일 발송 · 캘린더 연결 없음<br>새로고침하거나 체험을 초기화하면 모든 상태가 사라집니다.</footer>
<script>
'use strict';
const demo={name:'가상민수',email:'minsu.demo@example.com',bad:'minsu.demo',date:'2026-10-08'};
let state;
const screen=document.getElementById('screen');
function reset(){state={page:0,name:'',email:'',selected:null,booked:null,errors:{}};render()}
function go(page){state.page=page;state.errors={};render()}
function button(text,action,secondary=false){return `<button type="button" data-action="${action}" class="${secondary?'secondary':''}">${text}</button>`}
function summary(){return `<dl><div><dt>참여자</dt><dd>${demo.name}</dd></div><div><dt>가상 이메일</dt><dd>${demo.email}</dd></div><div><dt>인터뷰 일시</dt><dd>${demo.date} · ${state.booked} KST</dd></div><div><dt>시간 기준</dt><dd>한국 표준시 (UTC+9)</dd></div></dl>`}
function render(){
document.getElementById('steps').innerHTML=['가입','시간 선택','예약 확인'].map((t,i)=>`<span ${(state.page===i+1)?'class="active" aria-current="step"':''}>${i+1}. ${t}</span>`).join('');
const heading=(k,t)=>`<div class="eyebrow">${k}</div><h1 id="title" tabindex="-1">${t}</h1>`;
if(state.page===0)screen.innerHTML=heading('작은 제품팀의 고객 인터뷰','다음 고객과 만날 시간을 정해 보세요.')+`<p class="muted">가입부터 시간 선택, 예약 확인까지 짧게 체험하세요.</p><div class="notice"><strong>시연용 가상 자료입니다.</strong><br>실제 개인정보를 입력하지 마세요. 지정된 가상 이름과 이메일만 사용합니다. 입력값은 현재 페이지 메모리에서만 유지합니다.</div><p>가상 참여자: 가상민수<br>가상 일정: 2026-10-08 · 한국 표준시 KST</p><div class="actions">${button('예약 체험 시작','start')}</div>`;
if(state.page===1){screen.innerHTML=heading('01 / 가입','먼저 가상 참여자를 알려 주세요')+`<p class="muted">실제 계정은 만들어지지 않습니다. 실제 개인정보 입력 금지.</p><div class="notice">이름: <strong>가상민수</strong><br>이메일: <strong>minsu.demo@example.com</strong><br>오류 체험에는 <strong>minsu.demo</strong>를 사용하세요.</div><form id="signup" novalidate autocomplete="off"><label for="name">가상 이름</label><input id="name" autocomplete="off" spellcheck="false" aria-describedby="name-error"><p class="error" id="name-error" aria-live="polite"></p><label for="email">가상 이메일</label><input id="email" type="text" inputmode="email" autocomplete="off" spellcheck="false" aria-describedby="email-error"><p class="error" id="email-error" aria-live="polite"></p><div class="actions">${button('이전','home',true)}<button type="submit">가입하고 시간 선택</button></div></form>`;for(const key of ['name','email']){const el=document.getElementById(key);el.value=state[key];el.setAttribute('aria-invalid',String(!!state.errors[key]));document.getElementById(key+'-error').textContent=state.errors[key]||'';el.addEventListener('input',()=>{state[key]=el.value})}document.getElementById('signup').addEventListener('submit',e=>{e.preventDefault();signup()})}
if(state.page===2)screen.innerHTML=heading('02 / 시간 선택','언제가 편하세요?')+`<p>2026-10-08 · 한국 표준시 <strong>KST (UTC+9)</strong></p><p class="muted">시연용 가능 시간입니다. 실제 캘린더와 연결되지 않습니다.</p>${state.booked?`<div class="notice">기존 예약: ${demo.date} · ${state.booked} KST<br>변경을 확인하기 전까지 기존 예약이 유지됩니다.</div>`:''}<div class="slots" role="group" aria-label="가능 시간">${['10:00','14:00','16:00'].map(t=>`<button type="button" data-time="${t}" aria-pressed="${state.selected===t}">${t}</button>`).join('')}</div><p class="status" id="selection">${state.selected?state.selected+' KST 선택됨 · '+(state.booked?'변경 확인 전':'예약 전'):'시간 미선택'}</p><p class="error" id="time-error" role="alert">${state.errors.time||''}</p><div class="actions">${button('이전','signup',true)}${state.booked?button('변경 취소','cancel',true):''}${button(state.booked?'변경 예약 확인':'예약 확인','book')}</div>`;
if(state.page===3)screen.innerHTML=heading('03 / 예약 확인','예약 완료 — 시연')+summary()+`<div class="notice"><strong>가상 예약 체험을 마쳤습니다.</strong><br>실제 예약은 생성되지 않습니다. 실제 초대 메일은 발송되지 않습니다.</div><div class="actions">${button('시간 바꾸기','change',true)}${button('처음부터 체험','reset')}</div>`;
document.getElementById('title').focus();
}
function signup(){const e={};if(!state.name.trim())e.name='이름을 입력해 주세요';else if(state.name!==demo.name)e.name='가상 이름 가상민수만 사용해 주세요';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email))e.email='이메일 형식을 확인해 주세요';else if(state.email!==demo.email)e.email='가상 이메일 minsu.demo@example.com만 사용해 주세요';state.errors=e;if(Object.keys(e).length){render();document.getElementById(e.name?'name':'email').focus()}else go(2)}
screen.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.time){state.selected=b.dataset.time;state.errors={};render();screen.querySelector(`[data-time="${state.selected}"]`).focus();return}switch(b.dataset.action){case 'start':case 'signup':go(1);break;case 'home':go(0);break;case 'book':if(!state.selected){state.errors.time='예약 시간을 선택해 주세요';render();screen.querySelector('[data-time]').focus()}else{state.booked=state.selected;go(3)}break;case 'change':state.selected=state.booked;go(2);break;case 'cancel':state.selected=state.booked;go(3);break;case 'reset':reset();break}});
reset();
</script>
</body>
</html>
