<style>
:root{--ink:#162d36;--muted:#566b73;--line:#c8d3d6;--teal:#086e68;--mint:#e9f4ee;--violet:#7151a3;--lavender:#f4effb;--paper:#fafbf8}
*{box-sizing:border-box}body{margin:0;background:#dbe2e3;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif} .slide{width:1280px;height:720px;background:var(--paper);position:relative;margin:24px auto;padding:42px 54px;overflow:hidden;break-after:page;page-break-after:always} .slide:last-child{break-after:auto;page-break-after:auto}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:1.8px;color:var(--teal);margin:0 0 15px}h1{font-size:36px;letter-spacing:-1.4px;line-height:1.35;margin:0;font-weight:700} .sub{font-size:18px;color:var(--muted);margin:12px 0 0;line-height:1.5}.footer{position:absolute;left:54px;right:54px;bottom:25px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:13px}.brand{font-weight:700;letter-spacing:2px}.legend{display:flex;gap:24px;font-size:15px;margin-top:19px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:9px}.sample{width:32px;height:0;border-top:2px solid var(--teal)}.sample.next{border-top:2px dashed var(--violet)}
svg{display:block;font-family:inherit} .box{fill:#fff;stroke:var(--teal);stroke-width:2} .planned{fill:var(--lavender);stroke:var(--violet);stroke-width:2;stroke-dasharray:7 5}.svg-title{font-size:22px;font-weight:700;fill:var(--ink)}.svg-body{font-size:17px;fill:var(--muted)}.svg-label{font-size:15px;fill:var(--muted)}.flow{stroke:var(--teal);stroke-width:2;fill:none;marker-end:url(#arrow)}.memory-flow{stroke:var(--violet);stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#purple)}
.role-name{font-size:22px;font-weight:700;fill:var(--teal)}.role-desc{font-size:19px;fill:var(--ink)}
.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:30px}.scenario{border-top:3px solid var(--teal);padding:18px 22px 14px;background:#fff}.scenario:nth-child(2){border-color:#bd7b31}.scenario:nth-child(3){border-color:var(--violet)}.badge{font-size:18px;color:var(--teal);font-weight:700;display:inline-block;background:var(--mint);padding:7px 10px}.scenario:nth-child(2) .badge{color:#926021;background:#fbf1e3}.scenario:nth-child(3) .badge{color:var(--violet);background:var(--lavender)}.scenario h2{font-size:25px;margin:14px 0 14px}.stage{min-height:58px}.stage small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}.stage strong{font-size:20px;font-weight:500;letter-spacing:-.5px}.stage.pm strong{font-weight:700;color:var(--teal)}.scenario:nth-child(2) .stage.pm strong{color:#926021}.scenario:nth-child(3) .stage.pm strong{color:var(--violet)}.down{font-size:23px;color:#9aabad;height:26px;margin-left:12px}.stage.human-decision{border-left:3px solid var(--ink);padding-left:13px}.stage.result{border-top:1px solid var(--line);padding-top:12px}.stage.result strong{font-weight:700}
@page{size:13.333333in 7.5in;margin:0} @media print{html,body{margin:0;background:white;width:1280px} .slide{margin:0;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact} }
.s3 .scen{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:14px}
.s3 .card{border:1px solid var(--line);border-top:3px solid var(--teal);padding:12px 16px;height:432px;display:flex;flex-direction:column;background:#fff}
.s3 .card:nth-child(1){border-top-color:var(--violet)}.s3 .card:nth-child(3){border-top-color:var(--violet)}
.s3 .card-head{display:flex;align-items:center;gap:10px}
.s3 .rb{font-size:18px;font-weight:700;color:var(--teal);background:var(--mint);padding:7px 10px;display:inline-block;white-space:nowrap}
.s3 .rb.next{color:var(--violet);background:var(--lavender);border:1px dashed var(--violet);padding:6px 9px}
.s3 .dom{font-size:15px;font-weight:700;color:var(--muted)}
.s3 .st{padding:9px 13px;font-size:16px;line-height:1.38}
.s3 .st small{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;margin-bottom:2px;color:var(--muted)}
.s3 .trig{margin-top:12px;background:#f1f4f3}
.s3 .act{background:var(--mint);border:2px solid var(--teal)}
.s3 .act.next{background:var(--lavender);border:2px dashed var(--violet)}
.s3 .act small{color:var(--teal)}.s3 .act.next small{color:var(--violet)}
.s3 .act .cap{font-weight:700;margin-top:6px}
.s3 .dec{background:#fbf1e3;border:1px solid #bd7b31;border-left:3px solid var(--ink)}
.s3 .dec small{color:#926021}
.s3 .res{border-top:1px solid var(--line);font-weight:700;padding-left:0}
.s3 .dn{height:20px;display:flex;justify-content:center;align-items:center}
.s3 .dn::before{content:"";border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #9aabad}
.s3 h1{word-break:keep-all}.s3 h1 em{font-style:normal;color:var(--teal)}

</style>
</head>
